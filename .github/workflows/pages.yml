name: Deploy tools to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "budget-lite/**"
      - "wealth-ladder/**"
      - "dinotaeng/**"
      - "salary-check/**"
      - "site-home/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            budget-lite/pnpm-lock.yaml
            wealth-ladder/pnpm-lock.yaml
            dinotaeng/pnpm-lock.yaml
            salary-check/pnpm-lock.yaml
      - name: Build budget-lite
        working-directory: budget-lite
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - name: Build wealth-ladder
        working-directory: wealth-ladder
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - name: Build dinotaeng
        working-directory: dinotaeng
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - name: Build salary-check
        working-directory: salary-check
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site-home/. _site/
          cp -r budget-lite/dist _site/budget
          cp -r wealth-ladder/dist _site/wealth-ladder
          cp -r dinotaeng/dist _site/dinotaeng
          cp -r salary-check/dist _site/salary
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
